name: Modern React CI/CD Pipeline
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate-and-build:
    name: Lint, Test & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Build Production Assets
        run: npm run build

      - name: Set up Python for Testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Component & Configuration Tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

  container-build:
    name: Docker Multi-Stage Build & Security Scan
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Container Image
        run: docker build -t modern-react-app:${{ github.sha }} .

      - name: Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: modern-react-app:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'
